    <style>
/* =========================================
   기본 설정
========================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body, button {
    touch-action: manipulation;
}

button, a, #jiyoon, .pet-hand {
    -webkit-tap-highlight-color: transparent;
}


body {

    min-height: 100vh;

    background:
        linear-gradient(
            180deg,
            #fff5fa,
            #ffe8f3
        );

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    color: #75445d;
}


/* =========================================
   전체 게임
========================================= */

.game {

    width: min(100%, 760px);

    margin: 0 auto;

    padding: 14px;

}


/* =========================================
   제목
========================================= */

.header {

    background: #fffafd;

    border: 3px solid #efa7c8;

    border-radius: 22px;

    padding: 14px;

    text-align: center;

    box-shadow:
        0 5px 20px
        rgba(190, 100, 145, 0.12);

}


.header h1 {

    color: #c65b91;

    font-size:
        clamp(22px, 5vw, 32px);

    margin-bottom: 4px;

}


.header p {

    font-size: 14px;

    color: #8d5871;

}


/* =========================================
   캐릭터 방
========================================= */

.room {

    position: relative;

    width: 100%;

    height: 500px;

    margin-top: 14px;

    overflow: hidden;

    border-radius: 26px;

    border: 3px solid #eba8c7;

    background:

        radial-gradient(
            circle at 50% 100%,
            #f8d6e7 0%,
            #fff1f8 40%,
            #fffafd 100%
        );

    box-shadow:
        0 8px 25px
        rgba(190, 100, 145, 0.12);

}


/* 바닥 그림 */

.room::after {

    content: "";

    position: absolute;

    width: 600px;

    height: 180px;

    left: 50%;

    bottom: -100px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background: #f4d1e2;

    opacity: 0.65;

    z-index: 0;

}


/* =========================================
   말풍선
========================================= */

.speech {

    position: absolute;

    z-index: 20;

    top: 45px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 235px;

    min-height: 72px;

    padding: 13px 17px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    background: white;

    border: 3px solid #f0a5c6;

    border-radius: 20px;

    color: #75445d;

    font-size: 15px;

    font-weight: bold;

    line-height: 1.5;

    box-shadow:
        0 5px 15px
        rgba(190, 100, 145, 0.12);

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;

}


/* 말풍선 꼬리 */

.speech::after {

    content: "";

    position: absolute;

    left: 28px;

    bottom: -14px;

    width: 22px;

    height: 22px;

    background: white;

    border-right: 3px solid #f0a5c6;

    border-bottom: 3px solid #f0a5c6;

    transform:
        rotate(45deg);

}


/* =========================================
   캐릭터 영역
========================================= */

.character-area {

    position: absolute;

    z-index: 5;

    left: 0;

    right: 0;

    bottom: 0;

    height: 430px;

    display: flex;

    justify-content: center;

    align-items: flex-end;

}


/* =========================================
   지윤띠니
========================================= */

#jiyoon {

    display: block;

    width: 300px;

    max-width: 65vw;

    max-height: 420px;

    object-fit: contain;

    user-select: none;

    pointer-events: none;

    transform-origin: bottom center;

    animation:
        idleBreathing 2.5s ease-in-out infinite;

}


/* 평상시 숨쉬는 느낌 */

@keyframes idleBreathing {

    0% {

        transform:
            translateY(0)
            scale(1);

    }

    50% {

        transform:
            translateY(-4px)
            scale(1.008);

    }

    100% {

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================================
   쓰다듬기 중 캐릭터
========================================= */

#jiyoon.petting {

    animation:
        pettingCharacter
        0.18s
        ease-in-out
        infinite alternate;

}


@keyframes pettingCharacter {

    0% {

        transform:
            translateY(0)
            rotate(-1deg)
            scale(1);

    }

    100% {

        transform:
            translateY(-4px)
            rotate(1deg)
            scale(1.01);

    }

}


/* =========================================
   🫳 쓰다듬기 손
========================================= */

.pet-hand {

    position: absolute;

    z-index: 30;

    left: 35%;

    top: 100px;

    font-size: 55px;

    opacity: 0;

    pointer-events: none;

    transform:
        translateX(45px)
        rotate(-15deg);

}


/* 쓰다듬기 시작 */

.pet-hand.active {

    opacity: 1;

    animation:
        pettingHand
        0.23s
        ease-in-out
        infinite alternate;

}


/* 손이 위아래로 복복복 */

@keyframes pettingHand {

    0% {

        transform:
            translateX(45px)
            translateY(-8px)
            rotate(-20deg);

    }

    100% {

        transform:
            translateX(45px)
            translateY(18px)
            rotate(8deg);

    }

}


/* =========================================
   하트
========================================= */

.hearts {

    position: absolute;

    inset: 0;

    z-index: 40;

    pointer-events: none;

}


.floating-heart {

    position: absolute;

    font-size: 24px;

    animation:
        heartUp
        1.2s
        ease-out
        forwards;

}


@keyframes heartUp {

    0% {

        opacity: 0;

        transform:
            translateY(10px)
            scale(0.5);

    }

    20% {

        opacity: 1;

    }

    100% {

        opacity: 0;

        transform:
            translateY(-120px)
            scale(1.3);

    }

}


/* =========================================
   버튼
========================================= */

.buttons {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-top: 14px;

}


.button {

    border: 3px solid;

    border-radius: 18px;

    background: white;

    padding: 13px 5px;

    cursor: pointer;

    font-size: 14px;

    font-weight: bold;

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;

}


.button-icon {

    display: block;

    font-size: 27px;

    margin-bottom: 4px;

}


.button:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 7px 15px
        rgba(190, 100, 145, 0.14);

}


.button:active {

    transform:
        scale(0.94);

}


/* 버튼별 색 */

.pet-button {

    border-color: #aa95dc;

    color: #755cb4;

}


.love-button {

    border-color: #f19abb;

    color: #d15b8c;

}


.cheer-button {

    border-color: #76c7a3;

    color: #3b966f;

}


/* =========================================
   하단 문구
========================================= */

.bottom-text {

    margin-top: 12px;

    padding: 12px;

    background: white;

    border:
        2px solid #f2bfd5;

    border-radius: 16px;

    text-align: center;

    color: #a55e7d;

    font-size: 13px;

}


.bottom-text span {

    color: #ef91b7;

    margin: 0 5px;

}


/* =========================================
   모바일
========================================= */

@media (max-width: 600px) {


    .game {

        padding: 10px;

    }


    .room {

        height: 460px;

        border-radius: 22px;

    }


    .character-area {

        height: 390px;

    }


    #jiyoon {

        width: 255px;

        max-width: 70vw;

        max-height: 360px;

    }


    .speech {

        top: 35px;

        width: 190px;

        min-height: 65px;

        padding: 10px 13px;

        font-size: 13px;

        transform:
            translateX(-50%);

    }


    .speech::after {

        left: 23px;

    }


    .pet-hand {

        top: 95px;

        font-size: 45px;

        transform:
            translateX(35px)
            rotate(-15deg);

    }


    .pet-hand.active {

        animation:
            pettingHandMobile
            0.23s
            ease-in-out
            infinite alternate;

    }


    @keyframes pettingHandMobile {

        0% {

            transform:
                translateX(35px)
                translateY(-5px)
                rotate(-20deg);

        }

        100% {

            transform:
                translateX(35px)
                translateY(15px)
                rotate(8deg);

        }

    }


    .button {

        padding: 11px 3px;

        font-size: 12px;

    }


    .button-icon {

        font-size: 24px;

    }

}
    </style>
</head>

    jiyoon.src = POSE_IMAGES[poseName];


    poseResetTimer = setTimeout(() => {

        jiyoon.src = POSE_IMAGES.idle;

        poseResetTimer = null;

    }, duration);

}

// ==========================================
// 랜덤 선택 함수
// ==========================================

function randomMessage(array) {

    const index =
        Math.floor(
            Math.random() * array.length
        );

    return array[index];

}


// ==========================================
// 말풍선 변경 함수
// ==========================================

function changeSpeech(text) {

    speech.style.opacity = "0";

    speech.style.transform =
        "translateX(20px) translateY(5px)";

    setTimeout(() => {

        speech.textContent = text;

        speech.style.opacity = "1";

        speech.style.transform =
            "translateX(20px) translateY(0)";

    }, 200);

}


// ==========================================
// 10분마다 평상시 말풍선 변경
// ==========================================

setInterval(() => {

    changeSpeech(
        randomMessage(normalMessages)
    );

}, 10 * 60 * 1000);


// ==========================================
// 하트 생성
// ==========================================

function createHeart() {

    const heart =
        document.createElement("div");

    heart.className =
        "floating-heart";


    const heartTypes = [

        "♡",
        "♥",
        "💕",
        "💗",
        "💖"

    ];


    heart.textContent =
        randomMessage(heartTypes);


    heart.style.left =
        (
            40 +
            Math.random() * 20
        ) + "%";


    heart.style.top =
        (
            45 +
            Math.random() * 15
        ) + "%";


    hearts.appendChild(heart);


    setTimeout(() => {

        heart.remove();

    }, 1200);

}


// ==========================================
// 하트 여러 개
// ==========================================

function createHearts(amount) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        setTimeout(() => {

            createHeart();

        }, i * 120);

    }

}


// ==========================================
// 🫳 쓰다듬기
// ==========================================

let isPetting = false;


function startPetting() {

    // 이미 쓰다듬는 중이면 무시

    if (isPetting) {

        return;

    }


    isPetting = true;


    // 손 나타나기

    petHand.classList.add(
        "active"
    );


    // 캐릭터 움직이기

    jiyoon.classList.add(
        "petting"
    );


    // 말풍선

    changeSpeech(
        "아이 조아... ♡"
    );


    // 하트

    createHearts(3);


    // 1.2초 동안 쓰다듬기

    setTimeout(() => {

        stopPetting();

    }, 1200);

}


// ==========================================
// 쓰다듬기 종료
// ==========================================

function stopPetting() {

    isPetting = false;


    petHand.classList.remove(
        "active"
    );


    jiyoon.classList.remove(
        "petting"
    );


    changeSpeech(
        "헤헤... 오빠가 복복해줬다 ♡"
    );

}
